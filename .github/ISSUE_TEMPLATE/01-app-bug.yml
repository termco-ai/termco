name: Application bug
description: Report reproducible unexpected behavior in the Termco application.
title: "[App bug]: "
labels: ["bug", "area:app", "status:triage"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Remove credentials, private paths, source code, and server details from screenshots and logs.
  - type: input
    id: version
    attributes:
      label: Termco version
      placeholder: "0.9.2"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: ["macOS", "Windows", "Linux"]
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: ["arm64", "x64", "Other or unknown"]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized logs or screenshots
      description: Drag files here if helpful. Remove secrets and private project information first.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched for an existing report and removed sensitive information.
          required: true
